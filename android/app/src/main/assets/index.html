<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https: wss:; img-src 'self' data:"><title>灵动月历</title><link rel="stylesheet" href="app.css"></head><body>
<header><div><b class="brand">✦ 灵动月历</b><span class="subtitle">把日子过成喜欢的样子</span></div><button id="syncBadge">离线可用</button></header>
<main><section id="monthPage"><div class="month-nav"><h1 id="monthTitle"></h1><div><button id="prev" aria-label="上月">‹</button><button id="today">今天</button><button id="next" aria-label="下月">›</button></div></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendar" class="calendar"></div><div class="selected-head"><h2 id="dayTitle"></h2><span id="lunarFull"></span></div><div id="dayItems"></div></section>
<section id="tasksPage" hidden><h1>待办清单</h1><div id="tasks"></div></section>
<section id="syncPage" hidden><h1>电脑同步</h1><div class="card"><h2 id="cloudTitle">连接电脑日历</h2><p id="syncStatus" role="status">本机日程已保存，连接后再同步。</p><p>两端连接同一 Wi-Fi，在电脑小部件「··· → 手机同步」中开启服务，输入电脑地址与配对码。前台约每 2.5 秒同步，返回应用时自动重连。</p><label>电脑连接地址<input id="url" type="url" placeholder="https://192.168.1.8:24867" autocomplete="off"></label><label hidden>应用标识<textarea id="apiKey" rows="2" placeholder="请勿填写 service_role 或 secret key"></textarea></label><label hidden>本地账号<input id="email" type="email" autocomplete="username"></label><label>电脑配对码<input id="password" type="password" autocomplete="off" placeholder="ABCDEF-后面20位配对字符"></label><div class="buttons"><button id="login" class="primary">配对并同步</button><button id="signup" hidden>注册账号</button><button id="logout">断开连接</button><button id="syncNow">立即同步</button></div><p id="cloudError" class="error" role="alert"></p></div><div class="card"><h2>本机备份</h2><div class="buttons"><button id="export">导出 JSON</button><button id="import">导入 JSON</button><button id="notifications">开启手机通知</button></div><p>导入电脑端备份也能保留重复事项和待办状态。手机提醒采用系统普通闹钟，可能被系统延后。</p></div><div id="conflicts"></div></section>
</main><button class="fab" id="add" aria-label="添加日程">＋</button><nav><button data-tab="month">月历</button><button data-tab="tasks">待办</button><button data-tab="sync">同步</button></nav>
<dialog id="editor"><form id="editForm"><div class="dialog-title"><h2 id="editHeading">给这一天，留点安排</h2><button type="button" id="closeEditor">×</button></div><label>事项标题<input id="title" maxlength="120" required></label><div class="pair"><label>类型<select id="kind"><option value="event">日程</option><option value="task">待办</option></select></label><label>分类<select id="category"><option>学习</option><option>工作</option><option>生活</option><option>重要</option></select></label></div><div class="pair"><label>开始日期<input id="start" type="date" min="1902-01-01" max="2099-12-31" required></label><label>结束日期<input id="end" type="date" min="1902-01-01" max="2099-12-31" required></label></div><div class="pair"><label>时间<input id="time" type="time"></label><label class="check-label"><input id="allDay" type="checkbox" checked> 全天</label></div><div class="pair"><label>重复<select id="repeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周同一天</option><option value="monthly">每月同日</option><option value="yearly">每年同日</option></select></label><label>重复截止（可留空）<input id="until" type="date" max="2099-12-31"></label></div><label>提醒<select id="reminder"><option value="-1">不提醒</option><option value="0">到点提醒</option><option value="5">提前 5 分钟</option><option value="10">提前 10 分钟</option><option value="15">提前 15 分钟</option><option value="30">提前 30 分钟</option><option value="60">提前 1 小时</option><option value="1440">提前 1 天</option></select></label><label>备注<textarea id="notes" rows="3" maxlength="10000"></textarea></label><p id="formError" class="error" role="alert"></p><div class="buttons"><button type="button" id="delete" class="danger">删除事项</button><button type="submit" class="primary">保存事项</button></div></form></dialog>
<div id="toast" role="status"></div><input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="network.js"></script><script src="sync.js"></script><script src="calendar.js"></script><script src="app.js"></script></body></html>
